[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "Nodya"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aio-pika>=10.0.1",
  "aiogram>=3.30.0",
  "alembic>=1.18.5",
  "apscheduler>=3.11.3",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.31.0",
  "fastapi>=0.140.0",
  "httpx>=0.28.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "qdrant-client>=1.18.0",
  "redis>=8.0.1",
  "sqlalchemy>=2.0.51",
  "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.ruff]
line-length = 79
target-version = "py313"
extend-exclude = ["app/brain/migrations/versions", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/brain/migrations/versions/*" = ["E501"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
