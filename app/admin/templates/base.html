<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nodya Admin{% endblock %}</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
{% if principal %}
<header class="topbar">
  <div class="brand">Nodya <span class="sub">admin</span></div>
  <nav>
    <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">Обзор</a>
    <a href="/containers" class="{{ 'active' if active == 'containers' else '' }}">Контейнеры</a>
    <a href="/queues" class="{{ 'active' if active == 'queues' else '' }}">Очереди</a>
    <a href="/errors" class="{{ 'active' if active == 'errors' else '' }}">Ошибки</a>
    <a href="/logs" class="{{ 'active' if active == 'logs' else '' }}">Логи</a>
  </nav>
  <div class="topbar-right">
    <a class="muted" href="{{ grafana_url }}" target="_blank" rel="noopener">Grafana</a>
    <form method="post" action="/logout">
      <button type="submit" class="link">{{ principal.username }} · выйти</button>
    </form>
  </div>
</header>
{% endif %}
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="footer muted">Nodya Admin · {{ version }}</footer>
</body>
</html>
